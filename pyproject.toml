[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftsentry"
version = "0.1.0"
description = "Your infrastructure's immune system — detect IaC drift, attribute blame, auto-remediate with PRs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Hemanth KP" },
]
keywords = [
    "terraform",
    "opentofu",
    "drift",
    "iac",
    "infrastructure-as-code",
    "devsecops",
    "cloud",
    "aws",
    "remediation",
    "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "boto3>=1.35.0",
    "pydantic>=2.0.0",
    "deepdiff>=7.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "pygithub>=2.0.0",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "moto[all]>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "boto3-stubs[essential]>=1.35.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
driftsentry = "driftsentry.cli.main:app"

[project.urls]
Homepage = "https://github.com/hemanthkp98/driftsentry"
Documentation = "https://github.com/hemanthkp98/driftsentry#readme"
Repository = "https://github.com/hemanthkp98/driftsentry"
Issues = "https://github.com/hemanthkp98/driftsentry/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/driftsentry"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["driftsentry"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
